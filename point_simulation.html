<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가상 초파리 신경회로 실험</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: #0c111b; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 34px); }
    p { color: #aab5c6; line-height: 1.6; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    button { border: 1px solid #43516a; border-radius: 8px; background: #182337; color: #e8edf5; padding: 9px 13px; cursor: pointer; font: inherit; }
    button:hover { background: #23334d; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 8px 0; color: #8de0cb; font-size: 14px; }
    .map-frame { overflow: auto; border: 1px solid #344259; border-radius: 12px; background: #101725; padding: 8px; }
    canvas { display: block; margin: auto; max-width: 100%; cursor: crosshair; }
    canvas:focus-visible { outline: 3px solid #b9a5ff; outline-offset: 3px; }
    .help { margin: 8px 0 0; font-size: 13px; }
    @media (max-width: 600px) { main { width: calc(100% - 20px); padding-top: 16px; } .map-frame { padding: 3px; } }
  </style>
</head>
<body>
  <main>
    <h1>가상 초파리 신경회로 실험</h1>
    <p>Python이 회로 데이터를 읽고 강화학습과 매 스텝의 이동 결정을 처리합니다. 이 프로토타입은 실제 초파리 행동을 재현하거나 생물학적으로 검증한 모델이 아닙니다.</p>
    <div class="toolbar">
      <button id="learn" type="button" disabled>학습</button>
      <button id="run" type="button" disabled>실행</button>
      <button id="reset-learning" type="button">학습 초기화</button>
      <button id="reset-points" type="button">시작점·끝점 초기화</button>
    </div>
    <p id="circuit-status" class="help" aria-live="polite">Python 시뮬레이션을 준비하는 중입니다.</p>
    <p id="status" aria-live="polite">지도를 클릭해 시작점과 도착점을 순서대로 지정하세요.</p>
    <div class="map-frame">
      <canvas id="map" role="application" tabindex="0" aria-label="점 이동 지도" aria-describedby="map-help status"></canvas>
    </div>
    <p id="map-help" class="help">짙은 회색 통로를 선택하세요. 키보드로는 지도를 포커스한 뒤 방향키로 이동하고 Enter 또는 스페이스로 선택합니다.</p>
  </main>
  <script>
    const image = new Image();
    image.src = "지도.png";
    const canvas = document.getElementById("map");
    const context = canvas.getContext("2d");
    const status = document.getElementById("status");
    const circuitStatus = document.getElementById("circuit-status");
    const learnButton = document.getElementById("learn");
    const runButton = document.getElementById("run");
    let state = null;
    let displayScale = 1;
    let keyboardCursor = null;
    let runToken = 0;

    async function requestApi(path, body) {
      const options = { method: body === undefined ? "GET" : "POST" };
      if (body !== undefined) {
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(body);
      }
      const response = await fetch(path, options);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      return result;
    }

    function render(nextState) {
      if (!Array.isArray(nextState.path)) {
        nextState.path = state?.path || [];
        const previous = nextState.path[nextState.path.length - 1];
        if (nextState.point &&
            (!previous || previous.x !== nextState.point.x || previous.y !== nextState.point.y)) {
          nextState.path.push(nextState.point);
        }
      }
      state = nextState;
      const stats = state.stats;
      circuitStatus.textContent =
        `${stats.source}: 연결 ${stats.aggregated_edges}개 · `
        + `시냅스 ${stats.total_synapses.toLocaleString()}개 · `
        + `입력 뉴런 ${stats.presynaptic_neurons}개 `
        + `(측면 정보 ${stats.metadata_coverage}개)`;
      status.textContent = state.message;
      status.style.color = state.is_running ? "#8de0cb" : "#aab5c6";
      learnButton.disabled = !state.destination || state.is_running;
      runButton.disabled = !state.destination
        || state.successful_training_episodes === 0
        || state.is_running;
      resizeAndDraw();
    }

    function resizeAndDraw() {
      if (!image.complete || !image.naturalWidth) return;
      const frame = canvas.parentElement;
      const widthLimit = Math.max(200, frame.clientWidth - 18);
      const heightLimit = Math.max(200, window.innerHeight * 0.68);
      displayScale = Math.min(
        widthLimit / image.naturalWidth,
        heightLimit / image.naturalHeight
      );
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      canvas.style.width = `${image.naturalWidth * displayScale}px`;
      canvas.style.height = `${image.naturalHeight * displayScale}px`;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0);
      if (state?.path.length > 1) {
        context.beginPath();
        context.moveTo(state.path[0].x, state.path[0].y);
        for (const point of state.path.slice(1)) context.lineTo(point.x, point.y);
        context.strokeStyle = "rgba(0, 229, 255, 0.72)";
        context.lineWidth = 2 / displayScale;
        context.stroke();
      }
      if (state?.start) drawMarker(state.start, "#54e39b");
      if (state?.destination) drawMarker(state.destination, "#ffca58");
      if (state?.point) drawMarker(state.point, "#00e5ff");
      if (keyboardCursor && document.activeElement === canvas) {
        context.beginPath();
        context.arc(keyboardCursor.x, keyboardCursor.y, 7 / displayScale, 0, Math.PI * 2);
        context.lineWidth = 2 / displayScale;
        context.strokeStyle = "#b9a5ff";
        context.stroke();
      }
    }

    function drawMarker(point, color) {
      context.beginPath();
      context.arc(point.x, point.y, 5 / displayScale, 0, Math.PI * 2);
      context.fillStyle = color;
      context.fill();
      context.lineWidth = 1 / displayScale;
      context.strokeStyle = "#10202b";
      context.stroke();
    }

    function reportError(error) {
      status.textContent = `요청 실패: ${error.message}`;
      status.style.color = "#ff9a9a";
      if (!state) return;
      learnButton.disabled = !state.destination || state.is_running;
      runButton.disabled = !state.destination
        || state.successful_training_episodes === 0
        || state.is_running;
    }

    async function choosePoint(x, y) {
      try {
        render(await requestApi("/api/point", { x, y }));
      } catch (error) {
        reportError(error);
      }
    }

    async function pollRun(token) {
      while (token === runToken && state?.is_running) {
        await new Promise(resolve => setTimeout(resolve, 70));
        if (token !== runToken) return;
        try {
          render(await requestApi("/api/step", {}));
        } catch (error) {
          reportError(error);
          return;
        }
      }
    }

    image.addEventListener("load", resizeAndDraw);
    image.addEventListener("error", () => {
      status.textContent = "지도.png를 불러오지 못했습니다. HTML과 같은 폴더에 있는지 확인하세요.";
      status.style.color = "#ff9a9a";
    });
    window.addEventListener("resize", resizeAndDraw);

    canvas.addEventListener("click", event => {
      if (!image.naturalWidth) return;
      const rect = canvas.getBoundingClientRect();
      choosePoint(
        (event.clientX - rect.left) * image.naturalWidth / rect.width,
        (event.clientY - rect.top) * image.naturalHeight / rect.height
      );
    });

    canvas.addEventListener("keydown", event => {
      if (!image.naturalWidth) return;
      const deltas = {
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };
      const delta = deltas[event.key];
      if (delta) {
        event.preventDefault();
        if (!keyboardCursor) keyboardCursor = { x: image.naturalWidth / 2, y: image.naturalHeight / 2 };
        keyboardCursor = {
          x: Math.max(0, Math.min(image.naturalWidth - 1, keyboardCursor.x + delta[0] * state.grid_step)),
          y: Math.max(0, Math.min(image.naturalHeight - 1, keyboardCursor.y + delta[1] * state.grid_step))
        };
        resizeAndDraw();
      } else if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (!keyboardCursor) keyboardCursor = { x: image.naturalWidth / 2, y: image.naturalHeight / 2 };
        choosePoint(keyboardCursor.x, keyboardCursor.y);
      }
    });

    learnButton.addEventListener("click", async () => {
      learnButton.disabled = true;
      status.textContent = "Python에서 가상 시행을 학습 중입니다.";
      try {
        render(await requestApi("/api/train", {}));
      } catch (error) {
        reportError(error);
      }
    });

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      try {
        render(await requestApi("/api/run", {}));
        const token = ++runToken;
        await pollRun(token);
      } catch (error) {
        reportError(error);
      }
    });

    document.getElementById("reset-learning").addEventListener("click", async () => {
      runToken++;
      try {
        render(await requestApi("/api/reset-learning", {}));
      } catch (error) {
        reportError(error);
      }
    });

    document.getElementById("reset-points").addEventListener("click", async () => {
      runToken++;
      try {
        render(await requestApi("/api/reset-points", {}));
      } catch (error) {
        reportError(error);
      }
    });

    requestApi("/api/state").then(render).catch(reportError);
  </script>
</body>
</html>
