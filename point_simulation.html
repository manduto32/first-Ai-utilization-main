<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가상 초파리 신경회로 실험</title>
  <style>

    body { margin: 0; }

  <main>
    <h1>가상 초파리 신경회로 실험</h1>
    <p class="notice">
      원본 시냅스 연결 자료로 지정 뉴런에 들어오는 연결을 계산하고, 가상 초파리의 이동 선택에 반영합니다.
      지도는 단순 이동 환경입니다. 좌·우 감각 입력과 steering/forward 역할은 사용자 지정 가정이며,
      실제 초파리 행동이나 생물학적으로 검증된 회로를 재현하는 실험은 아닙니다.
    </p>
    <div class="toolbar">
      <button id="learn" type="button" disabled>학습</button>
      <button id="run" type="button" disabled>실행</button>
      <button id="reset-learning" type="button">학습 초기화</button>
      <button id="reset-points" type="button">시작점·끝점 초기화</button>
    </div>
    <p id="circuit-status" class="help" aria-live="polite">시냅스 연결 자료를 불러오는 중입니다.</p>
    <p id="status" aria-live="polite">지도를 클릭해 시작점과 도착점을 순서대로 지정하세요.</p>
    <div class="map-frame"><canvas id="map" aria-label="점 이동 지도"></canvas></div>
    <p class="help">짙은 회색 통로에 시작점 → 끝점을 지정하세요. 학습 후 실행하면 매 이동마다 회로 편향과 학습값으로 방향을 고릅니다.</p>
  </main>

AAAAAAAAAAAAAAAAAAAAAAAAAD///8HAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAYAAAAAPj/DwAAAAAAAAAAAAAAAAAAgP8BAAAAAAAAAAAA8P////8HAAAAAAAAAAAAAPj/DwAAAAAAAAAAAAAAAAAAAAAAAADA////AwAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAQAAAAAAAAAAAAAADAAAAAD+/wMAAAAAAAAAAAAAAAAAAOB/AAAAAAAAAAAAAPz/////AQAAAAAAAAAAAAD+/wMAAAAAAAAAAAAAAAAAAAAAAAAA8P///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAAAcAAACA//8AAAAAAAAAAAAAAAAAAADwHwAAAAAAAAAAAAD/////fwAAAAAAAAAAAACA//8AAAAAAAAAAAAAAAAAAAAAAAAAAPz//z8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAIADAAAA4P8/AAAAAAAAAAAAAAAAAAAA/AcAAAAAAAAAAADA/////x8AAAAAAAAAAAAA4P8/AAAAAAAAAAAAAAAAAAAAAAAAAAD///8PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAADAAQAAAPj/DwAAAAAAAAAAAAAAAAAAAP8BAAAAAAAAAAAA8P////8HAAAAAAAAAAAAAPj/DwAAAAAAAAAAAAAAAAAAAAAAAACA////AwAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAQAAAAAAAAAAAAAAYAAAAAD+/wMAAAAAAAAAAAAAAAAAAMB/AAAAAAAAAAAAAPz/////AwAAAAAAAAAAAAD+/wMAAAAAAAAAAAAAAAAAAAAAAAAA4P///wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAADAAAACA//8AAAAAAAAAAAAAAAAAAADwHwAAAAAAAAAAAAD//////wAAAAAAAAAAAACA//8BAAAAAAAAAAAAAAAAAAAAAAAAAPj//z8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAAAcAAAA4P8/AAAAAAAAAAAAAAAAAAAA/AcAAAAAAAAAAADA/////38AAAAAAAAAAAAA8P//AAAAAAAAAAAAAAAAAAAAAAAAAAD+//8fAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAAAAAAAAAAAAAAAADgAAAPj/DwAAAAAAAAAAAAAAAAAAAP8BAAAAAAAAAAAA+P////8/AAAAAAAAAAAAAP7//wAAAAAAAAAAAAAAAAAAAAAAAACA////BwAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAQAAAAAAAAAAAAAAgA8AAAD+/wMAAAAAAAAAAAAAAAAAAMB/AAAAAAAAAAAAAP//////HwAAAAAAAAAAAID//38AAAAAAAAAAAAAAAAAAAAAAAAA4P///wEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAAPA/AACA//8AAAAAAAAAAAAAAAAAAADwPwAAAAAAAAAAAOD//////w8AAAAAAAAAAADw//8/AAAAAAAAAAAAAAAAAAAAAAAAAPj//38AAAAAAAAAAAAAAAAAAAAAAAAAAAAAABgAAAAAAAAAAAAAAIAP/wAA4P8/AAAAAAAAAAAAAAAAAAAA/h8AAAAAAAAAAAD8//////8HAAAAAAAAAAAA/v//PwAAAAAAAAAAAAD+////AAAAAAD8//8fAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOAAAAAAAAAAAAAAD4APwDAPj/DwAAAAAAAAAAAAAAAAAAwP8PAAAAAAAAAACA////////AwAAAAAAAAAAwP///x8AAAD/////////////PwAAAAAA////BwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA /////////////////////////////////////////8DAAAAAMD/////AQAAAAAA+P///wEAAAAAAAAAAAAAAP//////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAADw/////wAAAP////////8PAAAAAAD+////////////////////////////////////////////////////////////////////////////////////////////////////////////////PwAAAAAA/P///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////w8AAAAAAP////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8DAAAAAMD/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAD4////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////PwAAAAAA/v///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////w8AAAAAwP////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8DAADw////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wP///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wMAAAAAAAD8//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////8/AAAAAAAAAAAAAAAAAAAA/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////wMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwP//////////////////////////////////////////////////////////////////////////////////////////////////////////DwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPD//////////////////////////////////////////////////////////////////////////////////////////////////wMAAAAAfAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD8//////////////////////////////////////////////////////////////////////////////////////////8PAAAAAB8AAAAAAB4AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"), c => c.charCodeAt(0));
    let circuitData = null;

    let animationFrame = null;
    let displayScale = 1;
    const learnButton = document.getElementById("learn");
    const runButton = document.getElementById("run");
    const Q_STATE_COUNT = 8 * 256;
    const ACTION_COUNT = 8;

    const TRAINING_EPISODES_PER_CLICK = 20;

    async function loadCircuitData() {
      try {
        const response = await fetch("/api/circuit");
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        if (!Array.isArray(data.roles) || !Array.isArray(data.visual_edges) ||
            !data.stats || data.roles.length === 0 || data.visual_edges.length === 0) {
          throw new Error("서버가 유효한 역할 뉴런 또는 연결 자료를 반환하지 않았습니다.");
        }
        circuitData = data;
        circuitReady = true;
        const stats = data.stats;
        circuitStatus.textContent =
          `${stats.source}: ${stats.aggregated_edges}개 집계 연결, `
          + `시냅스 ${stats.total_synapses.toLocaleString()}개 · `
          + `입력 뉴런 ${stats.presynaptic_neurons}개 `
          + `(측면 메타데이터 ${stats.metadata_coverage}개 확인)`;
        circuitStatus.style.color = "#8de0cb";
        learnButton.disabled = !start || !destination;
        runButton.disabled = !start || !destination || successfulTrainingEpisodes === 0;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        circuitStatus.textContent = `시냅스 연결 자료를 불러오지 못했습니다: ${message}`;
        circuitStatus.style.color = "#ff9a9a";
        learnButton.disabled = true;
        runButton.disabled = true;
      }
    }
    function legalActions(position) {
      const x = Math.floor(position.x / gridStep);
      const y = Math.floor(position.y / gridStep);
      const actions = [];
      for (let action = 0; action < moveDirections.length; action++) {
        const [dx, dy] = moveDirections[action];
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= maskWidth || ny >= maskHeight) continue;
        if (!isSafeCell(nx, ny)) continue;
        if (dx && dy &&
            (!isSafeCell(nx, y) || !isSafeCell(x, ny))) continue;
        actions.push(action);
      }
      return actions;
    }

    function getState(position, goal, actions) {
      const angle = Math.atan2(goal.y - position.y, goal.x - position.x);
      const goalDirection = (Math.round(angle / (Math.PI / 4)) + 8) % 8;
      let actionMask = 0;
      for (const action of actions) actionMask |= 1 << action;
      return goalDirection * 256 + actionMask;
    }

    function isAtGoal(position, goal) {
      return Math.floor(position.x / gridStep) === Math.floor(goal.x / gridStep)
        && Math.floor(position.y / gridStep) === Math.floor(goal.y / gridStep);
    }

    function getCircuitActivity(position, goal) {
      const dx = goal.x - position.x;
      const dy = goal.y - position.y;
      const distance = Math.hypot(dx, dy) || 1;
      const horizontalCue = dx / distance;
      const weighted = new Map(circuitData.roles.map(node => [node.root_id, 0]));
      const totals = new Map(circuitData.roles.map(node => [node.root_id, 0]));
      for (const edge of circuitData.visual_edges) {
        const sideCue = edge.pre_side === "left" ? Math.max(0, -horizontalCue) :
          edge.pre_side === "right" ? Math.max(0, horizontalCue) : 0;
        const inputActivity = 0.2 + sideCue * 0.8;
        weighted.set(edge.post_id, weighted.get(edge.post_id) + inputActivity * edge.synapse_count);
        totals.set(edge.post_id, totals.get(edge.post_id) + edge.synapse_count);
      }
      return circuitData.roles.map(node => ({
        root_id: node.root_id,
        side: node.side,
        model_role: node.model_role,
        activity: totals.get(node.root_id) ? weighted.get(node.root_id) / totals.get(node.root_id) : 0
      }));
    }

    function getCircuitBias(action, activities, position, goal) {
      const [dx] = moveDirections[action];
      const steeringLeft = activities.find(node => node.model_role === "steering" && node.side === "left")?.activity || 0;
      const steeringRight = activities.find(node => node.model_role === "steering" && node.side === "right")?.activity || 0;
      const forward = activities.filter(node => node.model_role === "forward")
        .reduce((sum, node) => sum + node.activity, 0) /
        Math.max(1, activities.filter(node => node.model_role === "forward").length);
      const goalDx = Math.sign(goal.x - position.x);
      return 0.08 * (steeringRight - steeringLeft) * dx * goalDx
        + 0.04 * forward * (dx * goalDx);
    }

    function selectAction(state, actions, position, goal, explore) {
      if (explore && Math.random() < explore) {
        return actions[Math.floor(Math.random() * actions.length)];
      }
      const activities = getCircuitActivity(position, goal);
      let bestAction = actions[0];
      let bestValue = -Infinity;
      for (const action of actions) {
        const value = qValues[state * ACTION_COUNT + action]
          + getCircuitBias(action, activities, position, goal);
        if (value > bestValue) {
          bestValue = value;
          bestAction = action;
        }
      }
      return bestAction;
    }

    function stepTo(position, action) {
      const [dx, dy] = moveDirections[action];
      return indexToPoint(
        (Math.floor(position.y / gridStep) + dy) * maskWidth
        + Math.floor(position.x / gridStep) + dx
      );
    }

    function isWalkable(x, y) {
      if (x < 0 || y < 0 || x >= image.naturalWidth || y >= image.naturalHeight) return false;
      const gx = Math.min(maskWidth - 1, Math.floor(x / gridStep));
      const gy = Math.min(maskHeight - 1, Math.floor(y / gridStep));
      const index = gy * maskWidth + gx;
      return (walkableBits[index >> 3] & (1 << (index & 7))) !== 0;
    }

    function isSafeCell(x, y) {
      if (x < 0 || y < 0 || x >= maskWidth || y >= maskHeight) return false;
      return safeCells[y * maskWidth + x] === 1;
    }

    function rebuildSafeCells() {
      safeCells.fill(0);
      for (let y = 0; y < maskHeight; y++) {
        for (let x = 0; x < maskWidth; x++) {
          const centerX = x * gridStep + gridStep / 2;
          const centerY = y * gridStep + gridStep / 2;
          if (isWalkable(centerX, centerY)) safeCells[y * maskWidth + x] = 1;
        }
      }
      safeRadiusKey = 0;
    }

    function resizeAndDraw() {
      if (!image.complete || !image.naturalWidth) return;
      const frame = canvas.parentElement;
      const maxWidth = Math.max(200, frame.clientWidth - 18);
      const maxHeight = Math.max(200, window.innerHeight * 0.68);
      displayScale = Math.min(maxWidth / image.naturalWidth, maxHeight / image.naturalHeight);
      if (safeRadiusKey !== 0) rebuildSafeCells();
      canvas.style.width = `${image.naturalWidth * displayScale}px`;
      canvas.style.height = `${image.naturalHeight * displayScale}px`;

      ctx.clearRect(0, 0, image.naturalWidth, image.naturalHeight);

        ctx.moveTo(path[0].x, path[0].y);

        ctx.fillStyle = "#00e5ff";
        ctx.fill();
        ctx.lineWidth = 1 / displayScale;
        ctx.strokeStyle = "#10202b";
        ctx.stroke();
      }
    }

    function drawMarker(marker, color) {
      const radius = 5 / displayScale;
      ctx.beginPath();
      ctx.arc(marker.x, marker.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 1 / displayScale;
      ctx.strokeStyle = "#10202b";
      ctx.stroke();
    }

    function indexToPoint(index) {
      const x = index % maskWidth;
      const y = Math.floor(index / maskWidth);
      return {
        x: Math.min(image.naturalWidth - 1, x * gridStep + gridStep / 2),
        y: Math.min(image.naturalHeight - 1, y * gridStep + gridStep / 2)
      };
    }

    function moveFly(timestamp) {
      if (!point || !destination) return;
      if (!moveFly.lastStepAt) moveFly.lastStepAt = timestamp;
      if (timestamp - moveFly.lastStepAt < FLY_STEP_INTERVAL_MS) {
        animationFrame = requestAnimationFrame(moveFly);
        return;

      const actions = legalActions(point);
      if (actions.length === 0) {

        status.textContent = `실험 실패: 이동 가능한 방향이 없습니다 (${trialStepCount}스텝).`;

      const action = selectAction(state, actions, point, destination, 0);
      point = stepTo(point, action);

      resizeAndDraw();

      if (isAtGoal(point, destination)) {
        animationFrame = null;
        status.textContent = `실험 성공: 목표에 도착했습니다 (${trialStepCount}스텝).`;
        status.style.color = "#8de0cb";
        return;
      }
      if (trialStepCount >= MAX_TRIAL_STEPS) {
        animationFrame = null;
        status.textContent = `실험 실패: ${MAX_TRIAL_STEPS}스텝 안에 목표에 도착하지 못했습니다.`;
        status.style.color = "#ff9a9a";
        return;
      }
      animationFrame = requestAnimationFrame(moveFly);
    }

    image.addEventListener("load", resizeAndDraw);
    image.addEventListener("error", () => {
      status.textContent = "지도.png를 불러오지 못했습니다. point_simulation.html과 같은 폴더에 있는지 확인하세요.";

    canvas.addEventListener("click", event => {
      if (!image.naturalWidth) return;
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * image.naturalWidth / rect.width;
      const y = (event.clientY - rect.top) * image.naturalHeight / rect.height;
      if (!isWalkable(x, y)) {

      const gridX = Math.floor(x / gridStep);

        destination = null;
        point = selected;
        path = null;
        trialStepCount = 0;
        learnButton.disabled = true;
        runButton.disabled = true;
        status.textContent = "시작점을 지정했습니다. 끝점을 선택하세요.";
      } else {
        destination = selected;
        point = start;
        path = [start];
        trialStepCount = 0;
        learnButton.disabled = !circuitReady;
        runButton.disabled = !circuitReady || successfulTrainingEpisodes === 0;
        status.textContent = successfulTrainingEpisodes === 0
          ? "끝점을 지정했습니다. 먼저 도착에 성공하도록 학습하세요."
          : "끝점을 지정했습니다. 학습 또는 실행을 선택하세요.";
      }
      status.style.color = "#8de0cb";
      resizeAndDraw();
    });

    learnButton.addEventListener("click", () => {
      if (!start || !destination || !circuitReady) return;
      const episodes = TRAINING_EPISODES_PER_CLICK;
      const maxSteps = MAX_TRIAL_STEPS;
      let successes = 0;
      for (let episode = 0; episode < episodes; episode++) {
        let position = start;
        if (isAtGoal(position, destination)) {
          successes++;
          continue;
        }
        for (let step = 0; step < maxSteps; step++) {
          const actions = legalActions(position);
          if (actions.length === 0) break;
          const state = getState(position, destination, actions);
          const epsilon = Math.max(0.05, 0.7 * Math.exp(-(trainingEpisodes + episode) / 80));
          const action = selectAction(state, actions, position, destination, epsilon);
          const next = stepTo(position, action);
          const distanceBefore = Math.hypot(destination.x - position.x, destination.y - position.y);
          const distanceAfter = Math.hypot(destination.x - next.x, destination.y - next.y);
          const reached = isAtGoal(next, destination);
          const speedBonus = reached ? 20 * (maxSteps - step) / maxSteps : 0;
          const nextActions = reached ? [] : legalActions(next);
          const trapped = !reached && nextActions.length === 0;
          const reward = -0.05 + 0.1 * (distanceBefore - distanceAfter) / gridStep
            - (trapped ? 3 : 0)
            + (reached ? 30 + speedBonus : 0);
          const nextState = nextActions.length ? getState(next, destination, nextActions) : 0;
          let bestNextValue = 0;
          for (const nextAction of nextActions) {
            bestNextValue = Math.max(bestNextValue, qValues[nextState * ACTION_COUNT + nextAction]);
          }
          const qIndex = state * ACTION_COUNT + action;
          qValues[qIndex] += 0.18 * (
            reward + (reached ? 0 : 0.995 * bestNextValue) - qValues[qIndex]
          );
          position = next;
          if (reached) {
            successes++;
            break;
          }
        }
      }
      trainingEpisodes += episodes;
      successfulTrainingEpisodes += successes;
      runButton.disabled = successfulTrainingEpisodes === 0 || !circuitReady;
      status.textContent =
        `학습 완료: ${successes}/${episodes}회 도착 · 총 ${trainingEpisodes}회 학습`;
      status.style.color = "#8de0cb";
    });

    runButton.addEventListener("click", () => {
      if (!start || !destination || !circuitReady) return;
      if (successfulTrainingEpisodes === 0) {
        status.textContent = "먼저 학습 버튼을 눌러 도착에 성공한 학습 기록을 만드세요.";
        status.style.color = "#ffd27d";
        return;
      }
      if (isAtGoal(start, destination)) {
        point = start;
        status.textContent = "시작점이 이미 목표 위치입니다.";
        status.style.color = "#8de0cb";
        resizeAndDraw();
        return;
      }
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      moveFly.lastStepAt = 0;
      path = [start];
      point = start;
      trialStepCount = 0;
      status.textContent = "실험 실행 중: 매 스텝마다 연결 가중치와 학습값으로 방향을 고릅니다.";
      status.style.color = "#8de0cb";
      resizeAndDraw();
      animationFrame = requestAnimationFrame(moveFly);
    });

    document.getElementById("reset-learning").addEventListener("click", () => {
      qValues.fill(0);
      trainingEpisodes = 0;
      successfulTrainingEpisodes = 0;
      runButton.disabled = !circuitReady || !start || !destination;
      learnButton.disabled = !circuitReady || !start || !destination;
      status.textContent = "학습 기록을 초기화했습니다.";
      status.style.color = "#8de0cb";
    });

    document.getElementById("reset-points").addEventListener("click", () => {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      moveFly.lastStepAt = 0;
      start = null;
      destination = null;
      point = null;
      path = null;
      trialStepCount = 0;
      learnButton.disabled = true;
      runButton.disabled = true;
      status.textContent = "지도를 클릭해 시작점을 지정하세요.";
      status.style.color = "#8de0cb";
      resizeAndDraw();
    });

    loadCircuitData();
  </script>
</body>
</html>
